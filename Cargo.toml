[package]
name = "carbium"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Async client for Carbium: Solana RPC, DAS, quote and swap, WebSocket subscriptions, Carbon Stream, webhook checks, and the account, DCA and token APIs"
repository = "https://github.com/carbium-sh/carbium-rs"
readme = "README.md"
keywords = ["solana", "rpc", "websocket", "grpc", "yellowstone"]
categories = ["api-bindings", "cryptography::cryptocurrencies", "web-programming::http-client", "web-programming::websocket", "asynchronous"]
include = ["/src/**/*.rs", "/README.md", "/LICENSE"]

[package.metadata.docs.rs]
features = ["stream", "ws", "webhooks"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["rustls"]
# TLS through rustls with the platform's certificate roots: the default.
rustls = ["reqwest/rustls", "tokio-tungstenite?/rustls-tls-native-roots"]
# TLS through the system's own library instead (OpenSSL on Linux).
native-tls = ["reqwest/native-tls", "tokio-tungstenite?/native-tls"]
# The webhook signature check.
webhooks = ["dep:base64", "dep:hmac", "dep:sha2"]
# Carbon Stream (Yellowstone gRPC) on the stock client.
stream = ["dep:yellowstone-grpc-client", "dep:yellowstone-grpc-proto", "dep:futures-util", "tokio/macros", "tokio/rt", "tokio/sync"]
# WebSocket subscriptions.
ws = ["dep:futures-util", "dep:tokio-tungstenite", "tokio/macros", "tokio/rt", "tokio/sync"]

[dependencies]
base64 = { version = "0.23.1", optional = true }
futures-util = { version = "0.3.34", optional = true, default-features = false, features = ["sink", "std"] }
hmac = { version = "0.13.0", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = { version = "0.11.1", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
tokio-tungstenite = { version = "0.30.0", optional = true }
yellowstone-grpc-client = { version = "17.0.0", optional = true }
yellowstone-grpc-proto = { version = "14.0.1", optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
